    Skills:
      - name: Research areas
        icon: fa-solid fa-atom
        keywords: "General Relativity, Relativistic Cosmology, Gravitational Entropy, Modified Gravity, Exact Solutions, Inhomogeneous Spacetimes, Primordial Black Holes"

      - name: Methods
        icon: fa-solid fa-square-root-variable
        keywords: "Exact and semi-analytical methods, Covariant methods, Differential geometry, Relativistic fluid dynamics"

    Projects:
      - name: Schouten--Codazzi Gravity
        summary: >
          Study of the field equations, integrability conditions, exact solutions,
          matching problems, perturbations, and compact-object applications of Schouten--Codazzi gravity.
        highlights:
          - Exact cosmological and radiating solutions
          - Integrability and degree-of-freedom analysis
          - Black-hole and no-hair questions

      - name: Gravitational Entropy in Inhomogeneous Spacetimes
        summary: >
          Investigation of gravitational entropy and the gravitational arrow of time
          in exact inhomogeneous solutions and relativistic fluids.
        highlights:
          - Petrov classification
          - Fluids with energy flux
          - Exact cosmological models

      - name: Exact Models for Primordial Black Holes
        summary: >
          Development of exact and semi-analytical General Relativity models that can be
          compared with numerical primordial black-hole formation calculations.
        highlights:
          - LTB and Szekeres models
          - Scalar-field models
          - Comparison with numerical-relativity approaches
